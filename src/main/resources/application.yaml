server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: board-api
  datasource:
    url: jdbc:h2:file:./data/board;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
